<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ADR 0011 §6: send only our origin to YouTube (needed, or embeds fail with error 153). The CSP meta is injected at build time by vite.config.ts. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A holographic display that introduces itself, badly but truthfully."
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="./fonts/space-mono-regular.woff2"
    />
    <title>Transmission Pending</title>
  </head>
  <body>
    <noscript>
      <p style="margin: 2rem; font-family: sans-serif; color: #e8e8e8">
        Transmission Pending needs JavaScript to switch on.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
