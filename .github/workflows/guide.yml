# Scheduled channel guide refresh (ADR 0011 section 3).
#
# Every 30 minutes (and on demand, and after a release deploy) it rebuilds the LATEST v* release tag, resolves
# which channels are live with the YouTube Data API, writes dist/guide.json and redeploys to Pages. The guide is
# never committed (it would change git.commitCount). The app files and v1 facts are identical to the release.
#
# Never runs on pull requests, so forks never see the secret. If YOUTUBE_API_KEY is not set the run skips with a
# notice. To pause the schedule see docs/deployment.md.
name: Refresh channel guide

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Same group as deploy.yml: one Pages deployment at a time, never cancelled part-way. GitHub keeps one pending run
# per group, so a waiting run can be replaced by a newer one. That is safe: this workflow always deploys the
# latest v* tag, which is what a replaced tag deploy would have published.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CI: 'true'
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  gate:
    name: Check prerequisites
    # After a deploy run, only continue if that deploy succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Is the API key configured?
        id: check
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::YOUTUBE_API_KEY is not set, so the guide refresh is skipped. See docs/deployment.md."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build latest release with fresh guide
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select the latest v* release tag
        id: tag
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$tag" ]; then
            echo "::notice::No v* release tag exists yet; nothing to refresh."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --detach "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag ($(git rev-parse --short HEAD))"
      - uses: actions/setup-node@v5
        if: steps.tag.outputs.tag != ''
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        if: steps.tag.outputs.tag != ''
        run: npm ci
      - name: Build (strict facts)
        if: steps.tag.outputs.tag != ''
        run: npm run build
      # Rolling key: every run saves a new entry, and restores the newest one. The ledger holds the daily quota
      # spend, so it is saved even if a later step fails.
      - name: Restore quota ledger
        if: steps.tag.outputs.tag != ''
        id: ledger
        uses: actions/cache/restore@v4
        with:
          path: .guide-cache
          key: guide-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: guide-ledger-
      - name: Resolve the guide
        if: steps.tag.outputs.tag != ''
        id: resolve
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RELEASE: ${{ steps.tag.outputs.tag }}
        run: |
          # Last published guide, for last-good entries. Pages URL: https://<owner>.github.io/<repo>/guide.json
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          # Exit 1 (configuration error) fails the job. Exit 0 with "degraded" in the log still deploys.
          npm run guide:resolve -- \
            --out dist/guide.json \
            --release "$RELEASE" \
            --previous "https://${owner}.github.io/${repo}/guide.json" \
            --ledger .guide-cache/ledger.json
      - name: Save quota ledger
        if: always() && steps.resolve.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .guide-cache
          key: guide-ledger-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check dist/ does not contain the API key
        if: steps.tag.outputs.tag != ''
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if grep -rIlF -- "$YOUTUBE_API_KEY" dist; then
            echo "::error::dist/ contains the API key. Deployment stopped. Rotate the key."
            exit 1
          fi
          test -f dist/guide.json
          test -f dist/facts.json
          if find dist \( -name '*.map' -o -name '.gitkeep' \) | grep -q .; then
            echo "::error::dist/ contains source maps or .gitkeep files"
            exit 1
          fi
      - uses: actions/configure-pages@v5
        if: steps.tag.outputs.tag != ''
      - uses: actions/upload-pages-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
